services:
  postgres:
    image: postgres:16-alpine
    container_name: flow-manager-postgres
    environment:
      POSTGRES_DB: flow_manager
      POSTGRES_USER: flow_manager
      POSTGRES_PASSWORD: flow_manager
    ports:
      - "5433:5432"

  redis:
    image: redis:7.4-alpine
    container_name: flow-manager-redis
    ports:
      - "6379:6379"
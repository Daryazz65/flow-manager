server.port=8081

spring.application.name=flow-manager

spring.datasource.url=jdbc:postgresql://localhost:5433/flow_manager
spring.datasource.username=flow_manager
spring.datasource.password=flow_manager

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=flow-manager
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.flow_manager.dto
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.ack-mode=record

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

app.minio.endpoint=http://localhost:9000
app.minio.access-key=minioadmin
app.minio.secret-key=minioadmin
app.minio.bucket=files

app.topics.conversion-requested=file.conversion.requested
app.topics.conversion-result=file.conversion.result

app.outbox.fixed-delay=1000
app.outbox.batch-size=100
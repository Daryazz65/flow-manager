server:
  port: 8081

spring:
  application:
    name: flow-manager

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  datasource:
    url: jdbc:postgresql://localhost:5433/flow_manager
    username: flow_manager
    password: flow_manager

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: flow-manager
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: files

  topics:
    conversion-requested: file.conversion.requested
    conversion-result: file.conversion.result
    subscription-changed: subscription.changed

  subscription:
    cache-name: subscription-limits
    consumer-group: flow-manager-subscription-cache

  outbox:
    fixed-delay: 1000
    batch-size: 100